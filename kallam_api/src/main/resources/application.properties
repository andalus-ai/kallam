quarkus.application.name=kallam-api

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${KALLAM_DB_USER:kallam}
quarkus.datasource.password=${KALLAM_DB_PASSWORD:kallam}
quarkus.datasource.jdbc.url=${KALLAM_DB_URL:jdbc:postgresql://localhost:5432/kallam}

quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true

# Scholar research is not a sub-100ms request; the initial run and revision
# re-runs happen on this pool, off the HTTP request thread.
quarkus.thread-pool.max-threads=32

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${KALLAM_CORS_ORIGINS:*}

# Reasoning is opt-in. These build properties select the CDI producer at build time.
# Build with -Pandalus-runtime and set KALLAM_REASONING_ENABLED=true to enable it.
kallam.reasoning.enabled=${KALLAM_REASONING_ENABLED:false}
kallam.reasoning.model-id=${KALLAM_REASONING_MODEL_ID:}
kallam.reasoning.provider-id=${KALLAM_REASONING_PROVIDER_ID:}
kallam.reasoning.timeout=${KALLAM_REASONING_TIMEOUT:PT45S}
